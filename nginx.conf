events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/webhook.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # Webhook endpoint that logs all received requests
        location /webhook {
            access_log /var/log/nginx/webhook.log;
            
            # Log the request body
            lua_need_request_body on;
            access_by_lua_block {
                ngx.log(ngx.ERR, "Webhook received: " .. ngx.var.request_body)
            }
            
            return 200 'OK';
        }

        # Health check endpoint
        location /health {
            return 200 'Webhook service is healthy';
        }
    }
}